<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 88" role="img" aria-label="EchoSpec">
  <title>EchoSpec</title>
  <defs>
    <path id="e" d="M0 0h68v13H14v15h46v13H14v15h54v13H0V0z" />
  </defs>

  <!-- Origin padded so stroke miters stay inside the viewBox -->
  <g transform="translate(4 16)">
    <!-- Farther echo (faded) -->
    <use
      href="#e"
      x="18"
      y="-12"
      fill="none"
      stroke="#F59E0B"
      stroke-width="2"
      stroke-linejoin="miter"
      opacity="0.35"
    />

    <!-- Nearer echo -->
    <use
      href="#e"
      x="9"
      y="-6"
      fill="none"
      stroke="#F59E0B"
      stroke-width="2"
      stroke-linejoin="miter"
      opacity="0.7"
    />

    <!-- Primary mark -->
    <use href="#e" fill="#0F172A" />
  </g>
</svg>
