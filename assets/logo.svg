<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 88" role="img" aria-label="EchoSpec">
  <title>EchoSpec</title>
  <defs>
    <path id="e" d="M0 0h68v13H14v15h46v13H14v15h54v13H0V0z" />
    <style>
      .mark { fill: #0F172A; }
      .echo { stroke: #F59E0B; }
      @media (prefers-color-scheme: dark) {
        .mark { fill: #CBD5E1; }
        .echo { stroke: #FBBF24; }
      }
    </style>
  </defs>

  <!-- Origin padded so stroke miters stay inside the viewBox -->
  <g transform="translate(4 16)">
    <!-- Farther echo (faded) -->
    <use
      class="echo"
      href="#e"
      x="18"
      y="-12"
      fill="none"
      stroke-width="2"
      stroke-linejoin="miter"
      opacity="0.35"
    />

    <!-- Nearer echo -->
    <use
      class="echo"
      href="#e"
      x="9"
      y="-6"
      fill="none"
      stroke-width="2"
      stroke-linejoin="miter"
      opacity="0.7"
    />

    <!-- Primary mark -->
    <use class="mark" href="#e" />
  </g>
</svg>
